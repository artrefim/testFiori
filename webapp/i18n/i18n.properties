changelog.v110.changes=\
• Adaptation of user identification to the Business Partner model.\n\
• Dynamic equipment validation by SAP number or internal identifier.\n\
• Automatic determination of the equipment maintenance plant.\n\
• Reading of the internal identifier using a QR code or barcode.\n\
• Assisted selection when an identifier corresponds to multiple pieces of equipment.\n\
• Combined display of the equipment description, plant, and plant name.\n\
• Addition of an indicator to identify failures caused by misuse or impact.\n\
• Improved validation of mandatory fields and the initial content of the description.\n\
• Improved information messages and error handling.\n\
• Addition of the version history within the application.\n\
• Review and expansion of texts in the supported languages.

changelog.v100.changes=\
• First operational version of the application.\n\
• Creation of fault notifications.\n\
• Scanning of the SAP equipment number using a QR code or barcode.\n\
• Viewing notifications created by the user.