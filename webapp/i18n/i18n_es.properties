changelog.v111.changes=\
• Incorporación de la validación del estado del equipo durante su identificación.\n\
• Los equipos con estado NO ACTIVO se identifican visualmente mediante el campo de equipo y la información asociada.\n\
• Bloqueo de la creación de avisos de avería para equipos no activos.\n\
• Incorporación de la denominación de la ubicación técnica en el idioma del usuario.\n\
• Mejoras en la presentación de la información del equipo, la ubicación técnica y el centro de mantenimiento.\n\

changelog.v110.changes=\
• Adaptación de la identificación del usuario al modelo de Business Partner.\n\
• Validación dinámica del equipo por número SAP o identificador interno.\n\
• Determinación automática del centro de mantenimiento del equipo.\n\
• Lectura del identificador interno mediante código QR o código de barras.\n\
• Selección asistida cuando un identificador corresponde a varios equipos.\n\
• Visualización conjunta de la descripción del equipo, el centro y el nombre del centro.\n\
• Incorporación de un indicador para identificar averías debidas a uso indebido o golpe.\n\
• Mejora de la validación de campos obligatorios y del contenido inicial de la descripción.\n\
• Mejora de los mensajes informativos y del tratamiento de errores.\n\
• Incorporación del historial de versiones dentro de la aplicación.\n\
• Revisión y ampliación de los textos en los idiomas admitidos.

changelog.v100.changes=\
• Primera versión operativa de la aplicación.\n\
• Creación de avisos de avería.\n\
• Lectura del número SAP de equipo mediante código QR o código de barras.\n\
• Consulta de avisos creados por el usuario.
