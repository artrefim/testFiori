changelog.v111.changes=\
• Ajout de la validation du statut de l’équipement lors de son identification.\n\
• Les équipements ayant le statut INACTIF sont identifiés visuellement dans le champ de l’équipement et les informations associées.\n\
• Blocage de la création d’avis de panne pour les équipements inactifs.\n\
• Ajout de la désignation du poste technique dans la langue de l’utilisateur.\n\
• Amélioration de la présentation des informations relatives à l’équipement, au poste technique et au centre de maintenance.\n\

changelog.v110.changes=\
• Adaptation de l’identification de l’utilisateur au modèle Business Partner.\n\
• Validation dynamique de l’équipement par numéro SAP ou identifiant interne.\n\
• Détermination automatique du centre de maintenance de l’équipement.\n\
• Lecture de l’identifiant interne au moyen d’un code QR ou d’un code-barres.\n\
• Sélection assistée lorsqu’un identifiant correspond à plusieurs équipements.\n\
• Affichage combiné de la description de l’équipement, du centre et du nom du centre.\n\
• Ajout d’un indicateur permettant d’identifier les pannes dues à une mauvaise utilisation ou à un choc.\n\
• Amélioration de la validation des champs obligatoires et du contenu initial de la description.\n\
• Amélioration des messages d’information et de la gestion des erreurs.\n\
• Ajout de l’historique des versions dans l’application.\n\
• Révision et enrichissement des textes dans les langues prises en charge.

changelog.v100.changes=\
• Première version opérationnelle de l’application.\n\
• Création des avis de panne.\n\
• Lecture du numéro SAP de l’équipement au moyen d’un code QR ou d’un code-barres.\n\
• Consultation des avis créés par l’utilisateur.
