# yaml-language-server: $schema=https://sap.github.io/ui5-tooling/schema/ui5.yaml.json

specVersion: "3.1"
metadata:
  name: zf_av_averias
type: application
builder:
  resources:
    excludes:
      - "/test/**"
      - "/localService/**"
  customTasks:
    - name: deploy-to-abap
      afterTask: generateCachebusterInfo
      configuration:
        target:
          destination: N4X
          url: http://vhnvsn4xci.sap.navantia.es:44300
          client: '202'
        app:
          name: ZF_AV_AVERIAS
          description: Fiori Avisos de Avería
          package: ZMM_S4
          transport: N4XK901051
        exclude:
          - /test/
          - /localService/
