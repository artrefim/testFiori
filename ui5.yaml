specVersion: "3.1"
metadata:
  name: zf_av_averias
type: application
server:
  customMiddleware:
    - name: fiori-tools-proxy
      afterMiddleware: compression
      configuration:
        ignoreCertError: false
        backend:
          - path: /sap
            url: https://vhnvsn4xci.sap.navantia.es:44300
            client: "202"
        ui5:
          path:
            - /resources
            - /test-resources
          url: https://ui5.sap.com
          version: 1.84.34
    - name: fiori-tools-appreload
      afterMiddleware: compression
      configuration:
        port: 35729
        path: webapp
        delay: 300
    - name: fiori-tools-preview
      afterMiddleware: fiori-tools-appreload
      configuration:
        component: ZF_AV_AVERIAS
        ui5Theme: sap_horizon
builder:
  resources:
    excludes:
      - "/test/**"
      - "/localService/**"